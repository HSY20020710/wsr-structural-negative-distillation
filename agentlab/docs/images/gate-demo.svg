<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="WSR Gate demo">
  <defs><style>.bg{fill:#f5f8fb}.card{fill:white;stroke:#d5e1ea;stroke-width:2}.title{font:700 36px Arial,sans-serif;fill:#102033}.sub{font:400 18px Arial,sans-serif;fill:#607386}.h{font:700 20px Arial,sans-serif;fill:#142638}.t{font:400 16px Arial,sans-serif;fill:#506476}.pass{fill:#dff7ec;stroke:#35b779}.conflict{fill:#fff0dc;stroke:#e39a36}.unknown{fill:#edf1f5;stroke:#9aaaba}.badge{font:700 15px Arial,sans-serif}.line{stroke:#9ab2c4;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#9ab2c4"/></marker></defs>
  <rect width="1200" height="720" class="bg"/>
  <text x="70" y="78" class="title">WSR Gate Decision Flow</text><text x="70" y="112" class="sub">Demo-only visualization with synthetic examples and no paper metrics.</text>
  <rect x="70" y="165" width="310" height="430" rx="18" class="card"/><text x="105" y="215" class="h">Structured Candidate</text><text x="105" y="255" class="t">Entities</text><text x="125" y="288" class="t">S_CAUSE: cleaning issue</text><text x="125" y="320" class="t">W_DEFECT: porosity</text><text x="125" y="352" class="t">R_PERSON: operator</text><text x="105" y="405" class="t">Relations</text><text x="125" y="438" class="t">CAUSES</text><text x="125" y="470" class="t">RESPONSIBLE_FOR</text>
  <rect x="455" y="165" width="290" height="430" rx="18" class="card"/><text x="500" y="215" class="h">Ontology Checks</text><rect x="500" y="260" width="195" height="58" rx="12" class="pass"/><text x="525" y="296" class="badge" fill="#16834f">Wuli PASS</text><rect x="500" y="350" width="195" height="58" rx="12" class="conflict"/><text x="525" y="386" class="badge" fill="#9c5a00">Shili CONFLICT</text><rect x="500" y="440" width="195" height="58" rx="12" class="unknown"/><text x="525" y="476" class="badge" fill="#596a78">Unknown if unmapped</text>
  <rect x="820" y="165" width="310" height="430" rx="18" class="card"/><text x="855" y="215" class="h">Routed Output</text><text x="855" y="260" class="t">Positive supervision</text><text x="855" y="300" class="t">Structural negatives</text><text x="855" y="340" class="t">Evidence events</text><text x="855" y="400" class="t">Stored locally under runs/</text><text x="855" y="440" class="t">Ignored by Git</text>
  <path d="M385 380 H445" class="line"/><path d="M750 380 H810" class="line"/>
</svg>