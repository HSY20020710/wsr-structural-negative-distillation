<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Evidence chain demo">
  <defs><style>.bg{fill:#071521}.panel{fill:#0f2537;stroke:#2c5872;stroke-width:1.5}.title{font:700 36px Arial,sans-serif;fill:#f3fbff}.sub{font:400 18px Arial,sans-serif;fill:#a9c7dc}.h{font:700 20px Arial,sans-serif;fill:#eaf7ff}.t{font:400 15px Arial,sans-serif;fill:#b6d0df}.code{font:400 14px Consolas,monospace;fill:#87d7ff}.ok{fill:#37d39b}.blue{fill:#39a7ff}.warn{fill:#f0b35a}.line{stroke:#4e86a8;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#4e86a8"/></marker></defs>
  <rect width="1200" height="720" class="bg"/>
  <text x="70" y="78" class="title">Evidence Chain Explorer</text><text x="70" y="112" class="sub">Traceable demo artifacts without private reports or exact experiment results.</text>
  <rect x="80" y="170" width="290" height="380" rx="18" class="panel"/><text x="115" y="220" class="h">Input</text><text x="115" y="265" class="t">Synthetic demo text</text><text x="115" y="300" class="t">Schema-compatible format</text><text x="115" y="335" class="t">No production records</text><circle cx="315" cy="505" r="13" class="blue"/><text x="115" y="510" class="code">input_ref: demo_case</text>
  <rect x="455" y="170" width="290" height="380" rx="18" class="panel"/><text x="490" y="220" class="h">Tool Events</text><text x="490" y="265" class="t">ResearchAgent</text><text x="490" y="300" class="t">GateAuditAgent</text><text x="490" y="335" class="t">NegativeBuilderAgent</text><text x="490" y="370" class="t">EvaluationAgent policy note</text><circle cx="690" cy="505" r="13" class="ok"/><text x="490" y="510" class="code">event_id: EVT-...</text>
  <rect x="830" y="170" width="290" height="380" rx="18" class="panel"/><text x="865" y="220" class="h">Artifacts</text><text x="865" y="265" class="t">run_manifest.json</text><text x="865" y="300" class="t">gate_trace.json</text><text x="865" y="335" class="t">public_result_policy.json</text><text x="865" y="370" class="t">Local only, ignored by Git</text><circle cx="1065" cy="505" r="13" class="warn"/><text x="865" y="510" class="code">artifact_ref: runs/...</text>
  <path d="M378 360 H445" class="line"/><path d="M753 360 H820" class="line"/>
  <text x="80" y="640" class="t">The public demo shows reproducibility structure, not private dataset contents or final paper metrics.</text>
</svg>